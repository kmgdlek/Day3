<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 여행 추천 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: fixed; inset: 0; }
    #panel {
      position: fixed; z-index: 1000; left: 50%; bottom: 24px; transform: translateX(-50%);
      width: min(92vw, 460px); padding: 14px; background: #fff; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .22); display: grid; gap: 10px;
    }
    #row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    input, button { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    button { border: 0; background: #ff7a00; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #e66d00; }
    button:disabled { background: #bbb; cursor: wait; }
    #out { display: none; max-height: 34vh; overflow-y: auto; gap: 8px; }
    #out.show { display: grid; }
    #weather { font-size: 13px; color: #0b5; font-weight: 600; }
    #answer { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    #trace { font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="out">
      <div id="weather"></div>
      <div id="answer"></div>
      <div id="trace"></div>
    </div>
    <div id="row">
      <input id="q" placeholder="예: 내일 비 오는데 서쪽에서 갈 만한 곳" autocomplete="off">
      <button id="go">추천받기</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.5, scrollWheelZoom: false }).setView([33.38, 126.55], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18,
    }).addTo(map);
    // 트랙패드 관성 스크롤이 여러 번 확대되지 않도록 휠 한 동작당 한 단계(0.5)만 확대한다.
    let lastZoomAt = 0;
    map.getContainer().addEventListener('wheel', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - lastZoomAt < 350) return;
      lastZoomAt = now;
      map.setZoomAround(map.mouseEventToContainerPoint(e), map.getZoom() + (e.deltaY < 0 ? 0.5 : -0.5));
    }, { passive: false });
    const layer = L.layerGroup().addTo(map);
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function show(weatherText, answerText, traceText) {
      out.classList.add('show');
      weather.textContent = weatherText;
      answer.textContent = answerText;
      trace.textContent = traceText;
    }

    async function ask() {
      const message = q.value.trim();
      if (!message) return;
      go.disabled = true;
      layer.clearLayers();
      show('', '도구를 골라 검색하는 중…', '');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (data.error) {
          show('', '오류: ' + data.error, data.trace?.length ? '실행된 도구: ' + data.trace.map((t) => t.tool).join(' → ') : '상세 로그는 Vercel → Logs, 상태 점검은 /api/health');
          return;
        }

        const w = data.weather;
        show(
          w ? `${w.area} 지금 ${w.now.weather} ${w.now.temperature}°C · 오늘 강수확률 ${w.forecast[0].rain_probability}%` : '',
          data.answer,
          data.trace.length ? '사용한 도구: ' + data.trace.map((t) => `${t.tool}(${Object.values(t.input).join(', ')})`).join(' → ') : ''
        );
        const pts = data.spots.map((s) => {
          L.marker([s.lat, s.lng]).addTo(layer).bindPopup(
            `<b>${esc(s.name)}</b><br>${esc(s.areas.join(', '))} · ${s.indoor ? '실내' : '야외'}<br>${esc(s.description)}` +
            (s.approx ? '<br><small>위치는 대략적입니다</small>' : ''));
          return [s.lat, s.lng];
        });
        if (pts.length) map.flyToBounds(pts, { padding: [40, 40], maxZoom: 13, duration: 1.2 });
      } catch (e) {
        show('', '서버에 연결하지 못했습니다: ' + e.message, '배포된 주소에서 열었는지, /api/health 가 열리는지 확인하세요.');
      } finally {
        go.disabled = false;
      }
    }
    go.addEventListener('click', ask);
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) ask(); });
  </script>
</body>
</html>
