<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 여행 추천 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #side {
      position: fixed; z-index: 1000; top: 0; bottom: 0; left: 0; width: 380px; padding: 20px;
      background: #fff; box-shadow: 2px 0 16px rgba(0, 0, 0, .15);
      display: flex; flex-direction: column; gap: 14px;
    }
    #side h1 { margin: 0; font-size: 20px; }
    #row { display: grid; gap: 8px; }
    input, button { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid #ccc; }
    button { border: 0; background: #ff7a00; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #e66d00; }
    button:disabled { background: #bbb; cursor: wait; }
    #out { display: none; flex: 1; overflow-y: auto; gap: 10px; align-content: start; }
    #out.show { display: grid; }
    #weather { font-size: 13px; color: #0b5; font-weight: 600; }
    #answer { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
    #trace { font-size: 12px; color: #777; }
    #map { position: fixed; top: 0; bottom: 0; right: 0; left: 380px; }
    @media (max-width: 700px) {
      #side { top: auto; width: 100%; max-height: 55vh; border-radius: 16px 16px 0 0; }
      #map { left: 0; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="side">
    <h1>제주 여행 추천</h1>
    <div id="row">
      <input id="q" placeholder="예: 내일 비 오는데 서쪽에서 갈 만한 곳" autocomplete="off">
      <button id="go">추천받기</button>
    </div>
    <div id="out">
      <div id="weather"></div>
      <div id="answer"></div>
      <div id="trace"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.5, scrollWheelZoom: false }).setView([33.38, 126.55], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18,
    }).addTo(map);
    // 트랙패드 관성 스크롤이 여러 번 확대되지 않도록 휠 한 동작당 한 단계(0.5)만 확대한다.
    let lastZoomAt = 0;
    map.getContainer().addEventListener('wheel', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - lastZoomAt < 350) return;
      lastZoomAt = now;
      map.setZoomAround(map.mouseEventToContainerPoint(e), map.getZoom() + (e.deltaY < 0 ? 0.5 : -0.5));
    }, { passive: false });
    const layer = L.layerGroup().addTo(map);
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const FAIL = '추천을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    function show(weatherText, answerText, traceText) {
      out.classList.add('show');
      weather.textContent = weatherText;
      answer.textContent = answerText;
      trace.textContent = traceText;
    }

    async function ask() {
      const message = q.value.trim();
      if (!message) return;
      go.disabled = true;
      layer.clearLayers();
      show('', '도구를 골라 검색하는 중…', '');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const raw = await res.text();
        let data;
        try { data = JSON.parse(raw); } catch {
          console.error('JSON이 아닌 응답', res.status, raw.slice(0, 300));
          show('', FAIL, '');
          return;
        }
        if (data.error) { console.error(data.error); show('', FAIL, ''); return; }

        const w = data.weather;
        show(
          w ? `${w.area} 지금 ${w.now.weather} ${w.now.temperature}°C · 오늘 강수확률 ${w.forecast[0].rain_probability}%` : '',
          data.answer,
          data.trace.length ? '사용한 도구: ' + data.trace.map((t) => `${t.tool}(${Object.values(t.input).join(', ')})`).join(' → ') : ''
        );
        const pts = data.spots.map((s) => {
          L.marker([s.lat, s.lng]).addTo(layer).bindPopup(
            `<b>${esc(s.name)}</b><br>${esc(s.areas.join(', '))} · ${s.indoor ? '실내' : '야외'}<br>${esc(s.description)}` +
            (s.approx ? '<br><small>위치는 대략적입니다</small>' : ''));
          return [s.lat, s.lng];
        });
        if (pts.length) map.flyToBounds(pts, { padding: [40, 40], maxZoom: 13, duration: 1.2 });
      } catch (e) {
        console.error(e);
        show('', FAIL, '');
      } finally {
        go.disabled = false;
      }
    }
    go.addEventListener('click', ask);
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) ask(); });
  </script>
</body>
</html>
