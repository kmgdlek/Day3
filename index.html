<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>제주 여행 추천 지도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --bg: #faf8f4;
      --ink: #1d1d1b;
      --muted: #8b877e;
      --line: #e9e4da;
      --accent: #9a7b45;
      --side: clamp(300px, 34vw, 400px);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans KR', system-ui, sans-serif; color: var(--ink); background: var(--bg); }

    /* 사이드바 */
    #side {
      position: fixed; z-index: 1000; inset: 0 auto 0 0; width: var(--side);
      display: flex; flex-direction: column; gap: 28px; padding: clamp(24px, 4vw, 44px) clamp(20px, 2.6vw, 34px) 28px;
      background: var(--bg); border-right: 1px solid var(--line);
    }
    h1 { margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 26px; letter-spacing: -.01em; }
    h1::after { content: ''; display: block; width: 28px; height: 2px; margin-top: 14px; background: var(--accent); }

    #row { display: grid; gap: 14px; }
    #q {
      width: 100%; font: inherit; font-size: 15px; color: var(--ink); padding: 10px 0;
      background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; outline: none;
    }
    #q::placeholder { color: #b3aea4; }
    #go {
      font: inherit; font-size: 14px; letter-spacing: .08em; padding: 13px; min-height: 46px; border: 0; cursor: pointer;
      color: #fff; background: var(--ink); transition: background .2s;
    }
    #go:hover { background: var(--accent); }
    #go:disabled { background: #bdb8ae; cursor: wait; }

    /* 결과 */
    #out { flex: 1; min-height: 0; overflow-y: auto; display: none; flex-direction: column; gap: 22px; }
    #out.show { display: flex; }
    #out::-webkit-scrollbar { width: 4px; }
    #out::-webkit-scrollbar-thumb { background: var(--line); }

    .weather { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
    .weather b { color: var(--ink); font-weight: 500; }
    .answer { font-family: 'Noto Serif KR', serif; font-size: 14.5px; line-height: 1.9; white-space: pre-wrap; }
    .loading { font-size: 13px; color: var(--muted); }

    .spots { display: flex; flex-direction: column; }
    .spot {
      display: flex; width: 100%; font: inherit; color: inherit; text-align: left; background: none; border: 0;
      align-items: baseline; gap: 14px; padding: 13px 0; cursor: pointer;
      border-top: 1px solid var(--line); transition: padding-left .2s;
    }
    .spot:last-child { border-bottom: 1px solid var(--line); }
    .spot:hover { padding-left: 6px; }
    .spot .no { width: 16px; font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .spot .nm { font-size: 14px; font-weight: 500; }
    .spot .ds { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .spot:hover .nm { border-bottom: 1px solid var(--accent); }

    /* 지도 */
    #map { position: fixed; inset: 0 0 0 var(--side); background: #eceae5; }
    .leaflet-tile-pane { filter: grayscale(.45) saturate(.8) brightness(1.04); }
    .pin {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      font: 500 12px 'Noto Sans KR', sans-serif; color: #fff; background: var(--ink);
      border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }
    .pin.in { background: var(--accent); }
    .leaflet-popup-content-wrapper { border-radius: 4px; box-shadow: 0 6px 22px rgba(0, 0, 0, .18); }
    .leaflet-popup-content { margin: 12px 14px; font-family: 'Noto Sans KR', sans-serif; }
    .pop a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--accent); }
    .pop b { font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 14px; }
    .pop div { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* 상세 창 */
    #modal { position: fixed; inset: 0; z-index: 3000; display: none; place-items: center; background: rgba(20, 20, 18, .45); padding: 16px; }
    #modal.show { display: grid; }
    .card { width: min(100%, 440px); max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--bg); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
    .card .mm { height: 210px; background: #eceae5; }
    .card .body { padding: 22px 24px 24px; }
    .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card h2 { margin: 0; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 22px; }
    .card .x { font: inherit; font-size: 22px; line-height: 1; padding: 0 4px; background: none; border: 0; cursor: pointer; color: var(--muted); }
    .card dl { margin: 18px 0 0; display: grid; grid-template-columns: 64px 1fr; gap: 10px 8px; font-size: 13px; }
    .card dt { color: var(--muted); }
    .card dd { margin: 0; }
    .card .note { margin-top: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
    .card .naver {
      display: block; margin-top: 18px; padding: 13px; text-align: center; text-decoration: none;
      font-size: 14px; letter-spacing: .04em; color: #fff; background: var(--ink); transition: background .2s;
    }
    .card .naver:hover { background: var(--accent); }

    /* 세로 화면의 폰·작은 태블릿: 지도를 전체로 두고 아래에서 올라오는 패널 */
    @media (max-width: 760px) and (orientation: portrait) {
      #side {
        inset: auto 0 0 0; width: 100%; max-height: 52vh; max-height: 52dvh; gap: 14px; border-right: 0;
        padding: 20px 20px max(16px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 28px rgba(0, 0, 0, .14);
      }
      h1 { font-size: 20px; }
      h1::after { margin-top: 10px; }
      #q { font-size: 16px; } /* iOS 가 16px 미만 입력칸을 확대하는 것 방지 */
      #map { inset: 0; }
      .card .mm { height: 170px; }
      .card .body { padding: 18px 18px 20px; }
    }
    /* 가로로 눕힌 폰처럼 높이가 낮은 화면: 왼쪽 패널을 촘촘하게 */
    @media (orientation: landscape) and (max-height: 520px) {
      #side { gap: 14px; padding: 16px 18px 12px; }
      h1 { font-size: 20px; }
      h1::after { margin-top: 8px; }
      #q { padding: 6px 0; }
      #go { padding: 9px; min-height: 40px; }
      .card .mm { height: 130px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <aside id="side">
    <h1>제주 여행 추천</h1>
    <div id="row">
      <input id="q" placeholder="예: 내일 비 오는데 서쪽에서 갈 만한 곳" autocomplete="off">
      <button id="go">추천받기</button>
    </div>
    <div id="out"></div>
  </aside>

  <div id="modal" role="dialog" aria-modal="true" aria-label="장소 상세정보">
    <div class="card" id="card"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const FAIL = '추천을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.5, scrollWheelZoom: false, zoomControl: false }).setView([33.38, 126.55], 10);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18,
    }).addTo(map);

    // 트랙패드 관성 스크롤이 여러 번 확대되지 않도록 휠 한 동작당 한 단계(0.5)만 확대한다.
    let lastZoomAt = 0;
    map.getContainer().addEventListener('wheel', (e) => {
      e.preventDefault();
      const now = Date.now();
      if (now - lastZoomAt < 350) return;
      lastZoomAt = now;
      map.setZoomAround(map.mouseEventToContainerPoint(e), map.getZoom() + (e.deltaY < 0 ? 0.5 : -0.5));
    }, { passive: false });

    const layer = L.layerGroup().addTo(map);
    let markers = [];

    // 네이버 지도 검색(상세정보·리뷰·영업시간)으로 연결. 동명이 장소를 피하려고 '제주'를 붙인다.
    const naverUrl = (name) => 'https://map.naver.com/p/search/' + encodeURIComponent('제주 ' + name);

    let current = [];

    function render(data) {
      current = data.spots;
      const w = data.weather;
      const weatherHtml = w
        ? `<div class="weather"><b>${esc(w.area)}</b> · ${esc(w.now.weather)} ${w.now.temperature}°C · 오늘 강수확률 ${w.forecast[0].rain_probability}%</div>` : '';
      const spotsHtml = data.spots.length
        ? `<div class="spots">${data.spots.map((s, i) => `
            <button class="spot" data-i="${i}">
              <span class="no">${i + 1}</span><span class="nm">${esc(s.name)}</span>
              <span class="ds">${s.indoor ? '실내' : '야외'} · ${esc(s.description)}</span>
            </button>`).join('')}</div>` : '';
      $('out').innerHTML = `${weatherHtml}<div class="answer">${esc(data.answer)}</div>${spotsHtml}`;
    }

    function drawMap(spots) {
      layer.clearLayers();
      markers = spots.map((s, i) => {
        const icon = L.divIcon({
          className: '', iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -14],
          html: `<div class="pin ${s.indoor ? 'in' : ''}">${i + 1}</div>`,
        });
        return L.marker([s.lat, s.lng], { icon, title: s.name }).addTo(layer).on('click', () => openDetail(i));
      });
      map.invalidateSize();
      // 폰 세로 화면에서는 아래 패널이 지도를 가리므로 그만큼 비워 두고 맞춘다.
      const sheet = matchMedia('(max-width: 760px) and (orientation: portrait)').matches;
      const opt = sheet
        ? { paddingTopLeft: [30, 40], paddingBottomRight: [30, $('side').offsetHeight + 30] }
        : { padding: [60, 60] };
      if (spots.length) map.flyToBounds(spots.map((s) => [s.lat, s.lng]), { ...opt, maxZoom: 13, duration: 1.2 });
    }

    // ── 상세 창 ──
    let miniMap = null;
    const addrCache = {};

    function closeDetail() {
      $('modal').classList.remove('show');
      if (miniMap) { miniMap.remove(); miniMap = null; }
    }

    async function reverseGeocode(lat, lng) {
      const key = lat + ',' + lng;
      if (addrCache[key]) return addrCache[key];
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ko&zoom=17&lat=${lat}&lon=${lng}`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return (addrCache[key] = (await r.json()).display_name || '');
    }

    function openDetail(i) {
      const s = current[i];
      if (!s) return;
      $('card').innerHTML = `
        <div class="mm" id="mm"></div>
        <div class="body">
          <div class="top"><h2>${esc(s.name)}</h2><button class="x" aria-label="닫기">×</button></div>
          <dl>
            <dt>지역</dt><dd>${esc(s.areas.join(', '))}</dd>
            <dt>구분</dt><dd>${s.indoor ? '실내' : '야외'} · ${esc(s.description)}</dd>
            <dt>주소</dt><dd id="addr">불러오는 중…</dd>
          </dl>
          <div class="note">${s.approx ? '이 장소의 위치는 대략적인 추정값입니다. ' : '위치는 추정값이라 다소 어긋날 수 있습니다. '}정확한 위치·평점·리뷰·영업시간은 아래 네이버 지도에서 확인하세요.</div>
          <a class="naver" href="${naverUrl(s.name)}" target="_blank" rel="noopener noreferrer">네이버 지도에서 평점·리뷰 보기 ↗</a>
        </div>`;
      $('modal').classList.add('show');
      miniMap = L.map('mm', { zoomControl: false, attributionControl: false, scrollWheelZoom: false }).setView([s.lat, s.lng], 14);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(miniMap);
      L.marker([s.lat, s.lng], {
        icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], html: `<div class="pin ${s.indoor ? 'in' : ''}">${i + 1}</div>` }),
      }).addTo(miniMap);
      miniMap.invalidateSize();
      reverseGeocode(s.lat, s.lng)
        .then((a) => { if ($('addr')) $('addr').textContent = a || '주소 정보 없음'; })
        .catch(() => { if ($('addr')) $('addr').textContent = '주소를 불러오지 못했습니다'; });
    }

    $('out').addEventListener('click', (e) => {
      const row = e.target.closest('.spot');
      if (row) openDetail(Number(row.dataset.i));
    });
    $('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal' || e.target.closest('.x')) closeDetail();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

    function showOut(html) { $('out').classList.add('show'); $('out').innerHTML = html; }

    async function ask() {
      const message = $('q').value.trim();
      if (!message) return;
      $('go').disabled = true;
      layer.clearLayers();
      markers = [];
      showOut('<div class="loading">찾는 중…</div>');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const raw = await res.text();
        let data;
        try { data = JSON.parse(raw); } catch {
          console.error('JSON이 아닌 응답', res.status, raw.slice(0, 300));
          showOut(`<div class="answer">${FAIL}</div>`);
          return;
        }
        if (data.error) { console.error(data.error); showOut(`<div class="answer">${FAIL}</div>`); return; }
        render(data);
        drawMap(data.spots);
      } catch (e) {
        console.error(e);
        showOut(`<div class="answer">${FAIL}</div>`);
      } finally {
        $('go').disabled = false;
      }
    }

    $('go').addEventListener('click', ask);
    $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) ask(); });
  </script>
</body>
</html>
