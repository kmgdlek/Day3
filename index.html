<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 관광지 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: fixed; inset: 0; }
    #panel {
      position: fixed; z-index: 1000; left: 50%; bottom: 24px; transform: translateX(-50%);
      width: min(92vw, 420px); padding: 14px; background: #fff; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .22); display: grid; gap: 10px;
    }
    #row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select, button { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #ccc; background: #fff; }
    button { border: 0; background: #ff7a00; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #e66d00; }
    #msg { font-size: 13px; color: #555; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div id="row">
      <select id="area" aria-label="지역">
        <option>제주시</option><option>동쪽</option><option>서쪽</option><option>서귀포</option>
      </select>
      <select id="indoor" aria-label="실내/야외">
        <option value="">실내/야외 전체</option><option value="true">실내</option><option value="false">야외</option>
      </select>
    </div>
    <button id="go">관광지 찾기</button>
    <div id="msg"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomSnap: 0.5, wheelPxPerZoomLevel: 240, wheelDebounceTime: 80 }).setView([33.38, 126.55], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18,
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function search() {
      const q = new URLSearchParams({ area: area.value });
      if (indoor.value) q.set('indoor', indoor.value);
      msg.textContent = '불러오는 중…';
      layer.clearLayers();
      try {
        const res = await fetch('/api/spots?' + q);
        const data = await res.json();
        if (data.error) { msg.textContent = data.error; return; }
        if (!data.spots.length) { msg.textContent = data.message; return; }
        const pts = data.spots.map((s) => {
          L.marker([s.lat, s.lng]).addTo(layer).bindPopup(
            `<b>${esc(s.name)}</b><br>${esc(s.areas.join(', '))} · ${s.indoor ? '실내' : '야외'}<br>${esc(s.description)}` +
            (s.approx ? '<br><small>위치는 대략적입니다</small>' : ''));
          return [s.lat, s.lng];
        });
        map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
        msg.textContent = `${data.total_matched}곳 중 ${data.count}곳 표시`;
      } catch (e) {
        msg.textContent = '데이터를 불러오지 못했습니다. 배포된 주소(/api/spots)에서 열어 주세요.';
      }
    }
    go.addEventListener('click', search);
  </script>
</body>
</html>
