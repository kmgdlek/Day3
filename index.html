<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 관광지 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #bar { display: flex; gap: 12px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
    #map { height: calc(100vh - 100px); }
    #msg { padding: 0 16px 6px; font-size: 14px; color: #555; min-height: 20px; }
  </style>
</head>
<body>
  <div id="bar">
    <label>지역
      <select id="area">
        <option>제주시</option><option>동쪽</option><option>서쪽</option><option>서귀포</option>
      </select>
    </label>
    <label>실내/야외
      <select id="indoor">
        <option value="">전체</option><option value="true">실내</option><option value="false">야외</option>
      </select>
    </label>
    <button id="go">찾기</button>
  </div>
  <div id="msg"></div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([33.38, 126.55], 10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18,
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function search() {
      const q = new URLSearchParams({ area: area.value });
      if (indoor.value) q.set('indoor', indoor.value);
      msg.textContent = '불러오는 중…';
      layer.clearLayers();
      try {
        const res = await fetch('/api/spots?' + q);
        const data = await res.json();
        if (data.error) { msg.textContent = data.error; return; }
        if (!data.spots.length) { msg.textContent = data.message; return; }
        const pts = data.spots.map((s) => {
          L.marker([s.lat, s.lng]).addTo(layer).bindPopup(
            `<b>${esc(s.name)}</b><br>${esc(s.areas.join(', '))} · ${s.indoor ? '실내' : '야외'}<br>${esc(s.description)}` +
            (s.approx ? '<br><small>위치는 대략적입니다</small>' : ''));
          return [s.lat, s.lng];
        });
        map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
        msg.textContent = `${data.total_matched}곳 중 ${data.count}곳 표시`;
      } catch (e) {
        msg.textContent = '데이터를 불러오지 못했습니다. 배포된 주소(/api/spots)에서 열어 주세요.';
      }
    }
    go.addEventListener('click', search);
  </script>
</body>
</html>
